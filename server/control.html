<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LAB08 모의 서버 제어판</title>
<style>body{font:17px/1.7 system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 20px;background:#f5f6f8;color:#1b2433}h1{margin-bottom:0}input,button{font:inherit;padding:8px 12px;margin:5px;border:1px solid #8796a8;border-radius:6px}button{cursor:pointer;background:white}pre{background:white;padding:20px;white-space:pre-wrap;border-radius:8px}small{display:block} .warning{border-left:4px solid #a36b14;padding-left:12px}</style>
<h1>스마트 센서 실험실</h1><p>같은 장애를 반복해 실행하면서 앱의 개선 전후를 비교합니다.</p>
<p class="warning">이 서버는 인증 없는 로컬 수업용입니다. room01(완만), room02(급격), room03(계단식) 중 하나를 선택하세요. room은 비밀번호가 아닙니다.</p>
<label>가상 방 <input id="room" value="room01" pattern="[A-Za-z0-9_-]{1,32}" maxlength="32"></label><button onclick="inspect()">방 선택 / 새로 확인</button>
<div id="buttons"></div><p id="result" role="status">시나리오를 선택하세요.</p>
<small>HTTP 요청 수는 Flutter의 /api/snapshot 호출만 셉니다. 이 제어판의 통계 조회 요청은 포함하지 않습니다. 값 급변은 +5 °C의 모의 변화입니다.</small>
<pre id="stats">연결 확인 중</pre>
<script>
const actions=[['pulse','값 급변 +5 °C'],['bad_json','잘못된 JSON 1회'],['disconnect','연결 강제 종료'],['pause','센서 전송 중단'],['resume','센서 전송 재개'],['reject_next','다음 명령 거절'],['delay_ack','다음 응답 5초 지연'],['drop_ack','다음 응답 누락'],['reset_stats','통계 초기화']];
function suffix(){const room=document.querySelector('#room').value.trim();if(!/^[A-Za-z0-9_-]{1,32}$/.test(room))throw Error('room은 영문, 숫자, _, -로 1~32자입니다.');return '?room='+encodeURIComponent(room);}
for(const [action,title] of actions){const button=document.createElement('button');button.textContent=title;button.onclick=async()=>{try{const r=await fetch('/api/scenario'+suffix(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});if(!r.ok)throw Error(await r.text());document.querySelector('#result').textContent=title+' 실행 완료';await inspect();}catch(e){document.querySelector('#result').textContent=String(e)}};document.querySelector('#buttons').append(button);}
async function inspect(){try{const r=await fetch('/api/stats'+suffix());if(!r.ok)throw Error(await r.text());document.querySelector('#stats').textContent=JSON.stringify(await r.json(),null,2);}catch(e){document.querySelector('#stats').textContent=String(e)}}
inspect();setInterval(inspect,1000);
</script></html>
